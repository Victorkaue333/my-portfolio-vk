<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Aplica o tema salvo antes da 1ª pintura (evita flash). Padrão: dark.
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
    <!-- Fonte: Manrope (variável, eixo wght 400–600), self-hosted em /fonts.
         Antes vinha por <link> do Google Fonts: o CSS era render-blocking e
         encadeava googleapis → gstatic → woff2 (~1,1 s de atraso no FCP/LCP no
         PageSpeed mobile). Servindo do mesmo domínio, o preload abaixo começa o
         download no 1º byte do HTML e o @font-face inline não bloqueia render.
         Subsets latin + latin-ext cobrem pt-BR, pt-PT, en e es.
         Para atualizar a fonte: baixar os .woff2 de
         https://fonts.googleapis.com/css2?family=Manrope:wght@400..600&display=swap
         (User-Agent de browser moderno) e substituir os arquivos. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/manrope-latin.woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('/fonts/manrope-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Manrope';
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url('/fonts/manrope-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
    </style>
    <!-- Meta/OG da Home. O prerender (scripts/prerender-meta.mjs) reescreve por rota. -->
    <meta name="description" content="Desenvolvedor full stack: sistemas web, APIs REST e dashboards com Python, Django, React e TypeScript — da ideia ao deploy. Projetos para empresas e instituições públicas. Veja o portfólio e fale comigo." />
    <meta name="author" content="Victor Kauê" />
    <meta name="theme-color" content="#0a0a12" />
    <link rel="canonical" href="https://victor-kaue.vercel.app/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Victor Kauê — Portfólio" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://victor-kaue.vercel.app/" />
    <meta property="og:title" content="Victor Kauê | Desenvolvedor Full Stack — Python, Django e React" />
    <meta property="og:description" content="Desenvolvedor full stack: sistemas web, APIs REST e dashboards com Python, Django, React e TypeScript — da ideia ao deploy. Projetos para empresas e instituições públicas. Veja o portfólio e fale comigo." />
    <!-- JPEG quadrado 280px (npm run images:optimize): o WhatsApp exibe miniatura
         compacta ao lado do título e ignora WebP. Não trocar por banner/WebP. -->
    <meta property="og:image" content="https://victor-kaue.vercel.app/images/og/home.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="280" />
    <meta property="og:image:height" content="280" />
    <meta property="og:image:alt" content="Victor Kauê | Desenvolvedor Full Stack — Python, Django e React" />

    <!-- Twitter / X — `summary` = card com miniatura quadrada -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://victor-kaue.vercel.app/" />
    <meta name="twitter:title" content="Victor Kauê | Desenvolvedor Full Stack — Python, Django e React" />
    <meta name="twitter:description" content="Desenvolvedor full stack: sistemas web, APIs REST e dashboards com Python, Django, React e TypeScript — da ideia ao deploy. Projetos para empresas e instituições públicas. Veja o portfólio e fale comigo." />
    <meta name="twitter:image" content="https://victor-kaue.vercel.app/images/og/home.jpg" />

    <title>Victor Kauê | Desenvolvedor Full Stack — Python, Django e React</title>

    <!-- preload:home -->
    <!-- Imagem LCP da Home. Sem isto o browser só a descobre depois de baixar e
         executar o JS (a Home é um chunk lazy). O prerender remove este bloco
         nas outras rotas — ver scripts/prerender-meta.mjs. -->
    <!-- imagesrcset/imagesizes iguais ao <img> em src/pages/Home/Home.tsx: sem
         eles o preload baixava o original, que o <img> nem usa (download duplo). -->
    <link rel="preload" as="image" href="/images/eu/victorkaue-450.webp" imagesrcset="/images/eu/victorkaue-280.webp 280w, /images/eu/victorkaue-450.webp 450w, /images/eu/victorkaue-560.webp 560w, /images/eu/victorkaue-900.webp 900w" imagesizes="(max-width: 480px) 65vw, (max-width: 768px) 70vw, 450px" fetchpriority="high" />
    <!-- /preload:home -->

    <link rel="icon" type="image/webp" href="/images/fotos-projetos-pessoais/vk-portifolio/logotipo-vk.webp" />

</head>
